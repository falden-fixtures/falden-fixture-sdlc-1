# The license of every file in this repository, as `reuse lint` reads it. The last annotation that
# matches a file wins. LICENSES/ holds the texts.
version = 1

[[annotations]]
path = "**"
precedence = "override"
SPDX-FileCopyrightText = "2026 Falden, Inc."
SPDX-License-Identifier = "CC-BY-4.0"

# The workflow.
[[annotations]]
path = ".github/**"
precedence = "override"
SPDX-FileCopyrightText = "2026 Falden, Inc."
SPDX-License-Identifier = "MIT"

# The README quotes published sources. Falden, Inc. does not license the quotations, and SPDX snippet
# tags mark each one LicenseRef-Quotation where it stands.
[[annotations]]
path = "README.md"
precedence = "override"
SPDX-FileCopyrightText = ["2026 Falden, Inc.", "The authors of the quoted sources"]
SPDX-License-Identifier = "CC-BY-4.0 AND LicenseRef-Quotation"
